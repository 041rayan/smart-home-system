name: smart_home_app
description: "Smart Home System Controller with ESP32 integration and Fire Push Notifications"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2
  flutter_background_service: ^5.1.0
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  path_provider: ^2.1.4
  face_recognition_engine: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mobilefacenet.tflite
